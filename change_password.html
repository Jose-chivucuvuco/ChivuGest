{% extends "base.html" %}
{% block content %}
<div class="pagehead"><div><h1>Alterar palavra-passe</h1><p class="muted">Atualize a palavra-passe da sua conta de forma segura.</p></div></div>
<div class="panel" style="max-width:650px">
  <form method="post" class="form">
    <label>Palavra-passe atual<input name="current_password" type="password" required></label>
    <label>Nova palavra-passe<input name="new_password" type="password" minlength="8" required></label>
    <label>Confirmar nova palavra-passe<input name="confirm_password" type="password" minlength="8" required></label>
    <div class="legal-note" style="grid-column:1/-1">Use pelo menos 8 caracteres, com uma letra maiúscula, uma minúscula e um número.</div>
    <div class="actions"><button>Guardar nova palavra-passe</button><a class="btn secondary" href="/users">Cancelar</a></div>
  </form>
</div>
{% endblock %}
