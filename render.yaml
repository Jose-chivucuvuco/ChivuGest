services:
  - type: web
    name: chivugest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180 --max-requests 20 --max-requests-jitter 5 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chivugest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: chivugest-db
