services:
  - type: web
    name: chivugest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chivugest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: chivugest-db
