{% extends "base.html" %}{% block content %}<h1>Clientes</h1><div class="panel"><form method="post" class="form"><input name="name" placeholder="Nome da empresa" required><input name="nif" placeholder="NIF"><input name="phone" placeholder="Telefone"><input name="email" placeholder="Email"><button>Adicionar</button></form></div><div class="panel"><table><tr><th>Cliente</th><th>NIF</th><th>Telefone</th><th>Email</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.nif}}</td><td>{{r.phone}}</td><td>{{r.email}}</td></tr>{% endfor %}</table></div>{% endblock %}
