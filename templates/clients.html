{% extends "base.html" %}{% block content %}<h1>Clientes</h1><div class="panel"><form method="post" class="form"><input name="name" placeholder="Nome da empresa" required><input name="nif" placeholder="NIF"><input name="phone" placeholder="Telefone"><input name="email" placeholder="Email"><button>Adicionar</button></form></div><div class="panel"><table><tr><th>Cliente</th><th>NIF</th><th>Telefone</th><th>Email</th>{% if session.role=='admin' %}<th>Ações</th>{% endif %}</tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.nif}}</td><td>{{r.phone}}</td><td>{{r.email}}</td>{% if session.role=='admin' %}<td><a class="btn small secondary" href="/admin/edit/client/{{r.id}}">Editar</a> <form method="post" action="/admin/delete/client/{{r.id}}" style="display:inline" onsubmit="return confirm('Eliminar este cliente?')"><button class="btn small danger">Eliminar</button></form></td>{% endif %}</tr>{% endfor %}</table></div>{% endblock %}
