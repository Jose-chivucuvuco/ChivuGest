{% extends "base.html" %}{% block content %}<h1>Faturas</h1><div class="panel"><form method="post" class="form"><input name="number" placeholder="Nº da fatura" required><select name="client_id" required><option value="">Cliente</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="date" type="date" required><input name="due_date" type="date" required><input name="amount" type="number" step=".01" placeholder="Valor" required><button>Registar</button></form></div><div class="panel"><table><tr><th>Nº</th><th>Cliente</th><th>Emissão</th><th>Vencimento</th><th>Valor</th><th>Pago</th><th>Estado</th></tr>{% for r in rows %}<tr><td>{{r.number}}</td><td>{{r.client.name}}</td><td>{{r.date}}</td><td>{{r.due_date}}</td><td>Kz {{r.amount}}</td><td>Kz {{r.paid}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
