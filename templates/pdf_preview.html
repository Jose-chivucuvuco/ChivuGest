{% extends "base.html" %}{% block content %}<h1>Revisão da Fatura PDF</h1><p class="muted">Confirme os dados reconhecidos pelo sistema antes de gravar.</p><div class="panel"><form method="post" action="/pdf-confirm" class="form"><input name="number" value="{{fields.number}}" placeholder="Nº da fatura" required><input name="client" value="{{fields.client}}" placeholder="Cliente" required><input name="nif" value="{{fields.nif}}" placeholder="NIF"><input name="date" value="{{fields.date}}" placeholder="Data"><input name="due_date" value="{{fields.due_date}}" placeholder="Vencimento"><input name="amount" value="{{fields.amount}}" placeholder="Valor total" required><button>Confirmar e importar</button></form></div><div class="panel"><h2>Texto reconhecido</h2><pre>{{text}}</pre></div>{% endblock %}
