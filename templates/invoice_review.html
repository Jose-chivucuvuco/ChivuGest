{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Revisão da fatura importada</h1><p class="muted">Confirme os dados antes do lançamento. Confiança estimada: <b>{{data.confidence}}%</b>.</p></div></div><div class="panel"><form method="post" action="/import/invoice-confirm" class="form three"><input name="number" value="{{data.number}}" placeholder="N.º da fatura" required><input name="supplier" value="{{data.supplier}}" placeholder="Fornecedor" required><input name="nif" value="{{data.nif}}" placeholder="NIF"><label>Data<input name="date" value="{{data.date}}" placeholder="DD/MM/AAAA"></label><label>Vencimento<input name="due_date" value="{{data.due_date}}" placeholder="DD/MM/AAAA"></label><input name="subtotal" value="{{data.subtotal}}" placeholder="Subtotal"><input name="vat" value="{{data.vat}}" placeholder="IVA"><input name="total" value="{{data.total}}" placeholder="Total" required><input name="currency" value="{{data.currency or 'AOA'}}" placeholder="Moeda"><select name="contracting_type" required><option value="">Tipo de contratação do fornecedor *</option>{% for t in contracting_types %}<option>{{t}}</option>{% endfor %}</select><button>Confirmar e gravar</button></form></div><div class="panel"><h2>Texto reconhecido</h2><pre>{{data.text}}</pre></div>{% endblock %}
