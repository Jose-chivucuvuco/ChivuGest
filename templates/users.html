{% extends "base.html" %}{% block content %}<h1>Utilizadores</h1><div class="panel"><form method="post" class="form"><input name="name" placeholder="Nome" required><input name="username" placeholder="Utilizador" required><input name="password" type="password" placeholder="Palavra-passe" required><select name="role"><option value="user">Utilizador</option><option value="admin">Administrador</option></select><button>Criar utilizador</button></form></div><div class="panel"><table><tr><th>Nome</th><th>Utilizador</th><th>Perfil</th><th>Estado</th><th>Ação</th></tr>{% for u in rows %}<tr><td>{{u.name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{"Ativo" if u.active else "Inativo"}}</td><td>{% if u.id != session.uid %}<a href="/users/toggle/{{u.id}}">Ativar/Desativar</a>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
