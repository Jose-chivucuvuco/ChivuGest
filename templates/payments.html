{% extends "base.html" %}{% block content %}<h1>Pagamentos</h1><div class="panel"><form method="post" class="form"><input name="receipt" placeholder="Nº recibo" required><select name="client_id" required><option value="">Cliente</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><select name="invoice_id"><option value="">Fatura (opcional)</option>{% for i in invoices %}<option value="{{i.id}}">{{i.number}} — Kz {{i.amount}}</option>{% endfor %}</select><input name="date" type="date" required><select name="method"><option>Transferência</option><option>TPA</option><option>Numerário</option><option>Cheque</option></select><input name="amount" type="number" step=".01" placeholder="Valor" required><button>Registar</button></form></div><div class="panel"><table><tr><th>Data</th><th>Recibo</th><th>Cliente</th><th>Fatura</th><th>Meio</th><th>Valor</th></tr>{% for p in rows %}<tr><td>{{p.date}}</td><td>{{p.receipt}}</td><td>{{p.client.name}}</td><td>{{p.invoice.number if p.invoice else ''}}</td><td>{{p.method}}</td><td>Kz {{p.amount}}</td></tr>{% endfor %}</table></div>{% endblock %}
